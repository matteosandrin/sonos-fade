[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonos-fade"
version = "0.1.0"
description = "Gradually fade the volume of a Sonos group on your LAN."
requires-python = ">=3.9"
dependencies = [
  "soco>=0.30",
  "requests",
]

[project.scripts]
sonos-fade = "sonos_fade.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonos_fade"]
